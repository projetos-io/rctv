<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="referrer" content="origin">
<title>RC PLAY</title>
<style>
:root{--bg:#050505;--card:#121212;--line:#2a2a2a;--red:#e50914;--glow:rgba(229,9,20,.35);--text:#f2f2f2;--dim:#9a9a9a;--ok:#1b5e20;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{background:radial-gradient(900px 420px at 50% -160px,rgba(229,9,20,.22),transparent),var(--bg);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--text)}
a{color:var(--red)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000c;border:1px solid var(--red);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9999;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
#toast.on{opacity:1}
.splash{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;min-height:100vh;color:var(--red);font-weight:800;letter-spacing:2px}
.spin{width:28px;height:28px;border:3px solid #333;border-top-color:var(--red);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* header */
header.top{position:sticky;top:0;z-index:10;background:rgba(5,5,5,.9);backdrop-filter:blur(14px);padding:calc(14px + env(safe-area-inset-top,0px)) 0 10px;border-bottom:1px solid rgba(255,255,255,.05)}
.logo-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{width:36px;height:36px;border-radius:50%;background:#000;border:2px solid var(--red);color:var(--red);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;box-shadow:0 0 16px var(--glow);flex:0 0 auto}
h1{font-size:18px;margin:0;letter-spacing:.6px;flex:1}h1 span{color:var(--red)}
.ibtn{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:700}
.ibtn:hover{border-color:var(--red);color:var(--red)}
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:30px;padding:11px 18px;font-size:14px;outline:none;margin-bottom:10px}
.search:focus,.field input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(229,9,20,.15)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 16px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--dim);font-size:13px;font-weight:600;white-space:nowrap}
.tab.active{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 4px 14px var(--glow)}
main{padding:16px 0 40px}
.status{text-align:center;color:var(--dim);padding:48px 0;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column}
.card:hover{border-color:var(--red);transform:translateY(-3px)}
.card.playing{border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 0 20px var(--glow)}
.thumb{height:92px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain;padding:10px}
.cover{aspect-ratio:16/9;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.cover img{width:100%;height:100%;object-fit:cover}
.fb{width:46px;height:46px;border-radius:50%;border:2px solid var(--red);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--red);font-size:15px}
.cb{padding:10px 12px 13px}
.cn{font-size:13px;font-weight:700;min-height:32px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cs{font-size:11px;color:var(--dim);margin-top:3px}
.watch{margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.5px;color:#fff;background:var(--red);border:0;border-radius:8px;padding:7px 0;width:100%;text-transform:uppercase}
/* login */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.box{width:100%;max-width:420px;background:rgba(0,0,0,.72);border:1px solid #333;border-radius:20px;padding:28px 22px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.box h2{margin:8px 0 4px;text-align:center}.box p.sub{margin:0 0 18px;text-align:center;color:var(--dim);font-size:14px}
.field{position:relative;margin-bottom:12px}
.field input{width:100%;background:#000a;border:1px solid var(--red);border-radius:10px;padding:13px 44px 13px 14px;outline:none}
.field .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;font-size:18px;padding:8px}
.btn{width:100%;background:#000b;border:2px solid var(--red);color:var(--red);border-radius:10px;padding:13px;font-weight:800;letter-spacing:.5px;margin-top:4px}
.btn:hover,.btn.fill{background:var(--red);color:#fff}
.btn.g{background:#fff;color:#222;border-color:#fff;display:flex;gap:10px;align-items:center;justify-content:center}
.links{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:13px;margin:6px 0 12px}
.links a{color:#fff;text-decoration:none;font-weight:600}
.swap{text-align:center;font-size:13px;margin-top:16px}.swap button{background:none;border:0;color:var(--red);font-weight:700}
.err{color:#ff6b6b;font-size:13px;margin:6px 0;min-height:18px;text-align:center}
/* home */
.hbar{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:#000;border-bottom:1px solid #1a1a1a;flex-wrap:wrap}
.hbar .t{font-weight:800;font-size:18px;flex:1;min-width:90px}
.hbar .m{font-size:12px;color:#ddd;line-height:1.4}.hbar .m b{color:#fff}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px;max-width:900px;margin:0 auto}
.hcard{position:relative;aspect-ratio:3/4;border-radius:18px;border:2px solid #330;background:linear-gradient(160deg,#1a0000,#000 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;overflow:hidden;box-shadow:0 0 22px rgba(255,0,0,.25);transition:.15s}
.hcard:hover{transform:scale(1.02);border-color:var(--red)}
.hcard .ico{font-size:52px;color:#fff;text-shadow:0 0 18px var(--red)}
.hcard .lb{font-size:26px;font-weight:900;font-style:italic;letter-spacing:1px;text-shadow:0 0 14px var(--red)}
.hcard:before{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent,rgba(255,0,0,.35),transparent 40%);animation:sp 6s linear infinite}
.hcard>*{position:relative}
.hcard:after{content:"";position:absolute;inset:3px;border-radius:15px;background:#0a0a0a;z-index:0}
.hcard>*{z-index:1}
/* anime / music */
.back{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:13px;font-weight:700;margin-bottom:16px}
.back:hover{border-color:var(--red);color:var(--red)}
.head{display:flex;align-items:center;gap:16px;margin-bottom:8px}
.hc{width:84px;height:84px;border-radius:18px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#111;font-size:28px;font-weight:800}
.hc img{width:100%;height:100%;object-fit:cover}
.hn{font-size:22px;font-weight:800;overflow-wrap:anywhere}.hs{font-size:13px;color:var(--dim);margin-top:4px}
.temp{font-size:14px;font-weight:700;color:#ff6b6b;margin:22px 0 10px}.soon{font-size:13px;color:var(--dim)}
.eps{display:flex;flex-wrap:wrap;gap:10px}
.ep{width:64px;height:64px;border-radius:14px;border:1px solid var(--red);background:#1c1c1c;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.ep b{font-size:18px}.ep small{font-size:9px;color:#a0a0a0}.ep.seen{background:var(--ok)}
.song{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.song:hover{border-color:var(--red)}.song.playing{border-color:var(--red);background:#1a0a0c}
.song .n{width:22px;text-align:center;font-size:12px;color:var(--dim)}.song .nm{flex:1;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.song .pp{width:32px;height:32px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:12px}
.mini{position:fixed;left:0;right:0;bottom:0;z-index:50;background:linear-gradient(180deg,#171717,#0a0a0a);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.mini .r{display:flex;align-items:center;gap:10px}
.mini .ti{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:700}
.mini .ti small{display:block;color:var(--dim);font-weight:400;font-size:11px}
.mini button{background:none;border:0;width:40px;height:40px;border-radius:50%;font-size:18px}
.mini button.pl{background:var(--red);width:48px;height:48px}
.mini input[type=range]{flex:1}
.mini .tm{font-size:10px;color:var(--dim);width:36px;text-align:center}
/* settings */
.set{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 40px}
.sec{font-size:18px;font-weight:800;margin:22px 0 8px}
.row{background:#000a;border:1px solid #2a0000;border-radius:10px;padding:13px 14px;margin-bottom:8px;font-size:14px;display:flex;gap:8px;justify-content:space-between;align-items:center;width:100%;text-align:left}
button.row{border:2px solid var(--red)}button.row:hover{background:#1a0000}
.row span:first-child{color:var(--dim)}
/* player */
.pl{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;z-index:30}
.pl-top{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:#111;border-bottom:1px solid #222;flex:0 0 auto}
.pl-top .tt{flex:1;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-top button{background:#222;border:1px solid var(--red);border-radius:18px;padding:7px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.stage{position:relative;flex:1;background:#000;overflow:hidden;min-height:0}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.stage video{position:absolute;inset:0;width:100%;height:100%;background:#000;object-fit:contain}
.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:#000d;border:1px solid var(--red);border-radius:12px;padding:10px 14px;font-size:13px;text-align:center;z-index:5;max-width:92%}
.hint button{margin:6px 4px 0;background:var(--red);border:0;border-radius:14px;padding:6px 12px;font-weight:700}
.ctrl{position:absolute;left:0;right:0;bottom:0;padding:30px 12px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.88));transition:opacity .25s;z-index:4}
.stage.idle .ctrl{opacity:0;pointer-events:none}.stage.idle{cursor:none}
.ctrl .seek{display:flex;align-items:center;gap:8px;font-size:11px;color:#ddd}
.ctrl input[type=range]{flex:1;accent-color:var(--red);height:24px}
.ctrl .btns{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.ctrl .btns button,.ctrl select{background:none;border:0;border-radius:8px;min-width:38px;height:38px;font-size:16px;color:#fff}
.ctrl select{background:#1c1c1c;border:1px solid #333;font-size:12px;min-width:0;padding:0 6px}
.ctrl .btns .big{background:var(--red);border-radius:50%;width:46px;height:46px}
.ctrl .sp{flex:1}
.live{background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:6px;padding:3px 6px;letter-spacing:1px}
.mid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:3}
.mid .spin{display:none}.stage.load .mid .spin{display:block}
.ovl{position:absolute;inset:0;background:#000c;z-index:8;display:flex;align-items:center;justify-content:center;padding:16px}
.ovl .box{background:#121212}
.doc{max-width:650px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 20px 40px}
.doc h1{text-align:center;border-bottom:3px solid var(--red);padding-bottom:10px;flex:none}
.doc h3{color:var(--red);text-transform:uppercase;font-size:16px;margin:24px 0 8px}
.doc p,.doc li{color:#b0b0b0;font-size:15px;line-height:1.6}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}.hgrid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div id="app"><div class="splash"><div class="spin"></div>RC PLAY</div></div>
<div id="toast"></div>

<!-- ===================== TEMPLATES ===================== -->
<template id="t-login">
<div class="auth"><div class="box">
  <div style="display:flex;justify-content:center"><div class="logo" style="width:56px;height:56px;font-size:18px">RC</div></div>
  <h2 id="lgTitle">Bem-vindo</h2>
  <p class="sub">Faça login com sua conta ou crie uma nova</p>
  <form id="lgForm" novalidate>
    <div class="field" id="fName"><input id="iName" placeholder="Nome de usuário" autocomplete="name"></div>
    <div class="field"><input id="iMail" type="email" placeholder="E-mail" autocomplete="email"></div>
    <div class="field"><input id="iPass" type="password" placeholder="Senha" autocomplete="current-password"><button type="button" class="eye" id="eye" aria-label="Mostrar senha">👁</button></div>
    <div class="links"><a href="#/redefinir" id="lkReset">Esqueceu a Senha?</a><a href="#/termos">Termos de Uso</a><a href="#/privacidade">Política de Privacidade</a></div>
    <div class="err" id="lgErr"></div>
    <button class="btn" id="lgGo" type="submit">ENTRAR</button>
  </form>
  <button class="btn g" id="lgG" type="button"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.3 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.4 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.9-4.7l-7.8-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.3-5.7c-2 1.4-4.7 2.3-8.6 2.3-6.3 0-11.7-4.1-13.6-9.8l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Entrar com Google</button>
  <div class="swap"><span id="swTxt">Ainda não tem uma conta?</span> <button id="swBtn" type="button">Criar conta</button></div>
</div></div>
</template>

<template id="t-home">
<div>
  <div class="hbar">
    <div class="logo">RC</div><div class="t">RC PLAY <small id="hVer" style="color:var(--dim);font-weight:400;font-size:11px"></small></div>
    <div class="m">Data: <b id="hDate">--/--</b><br>Hora: <b id="hTime">00:00:00</b></div>
    <div class="m" id="hNet" title="Conexão">📶</div>
    <div class="m" id="hBat" title="Bateria">🔋</div>
    <button class="ibtn" id="hSet">⚙ Config</button>
  </div>
  <div class="hgrid">
    <div class="hcard" data-go="site"><div class="ico">▶</div><div class="lb">CANAIS</div></div>
    <div class="hcard" data-go="anime"><div class="ico">▶</div><div class="lb">ANIMES</div></div>
    <div class="hcard" data-go="filmes"><div class="ico">▶</div><div class="lb">FILMES</div></div>
    <div class="hcard" data-go="musica"><div class="ico">▶</div><div class="lb">MÚSICAS</div></div>
  </div>
</div>
</template>

<template id="t-site">
<div>
  <header class="top"><div class="wrap">
    <div class="logo-row"><button class="ibtn" data-back>←</button><div class="logo">RC</div><h1>RC <span>AO VIVO</span></h1></div>
    <input class="search" id="q" type="search" placeholder="Buscar canal..." autocomplete="off">
    <div class="tabs" id="tabs"></div>
  </div></header>
  <main class="wrap"><div class="status" id="st">Carregando canais...</div><div class="grid" id="grid"></div></main>
</div>
</template>

<template id="t-anime">
<div>
  <header class="top"><div class="wrap">
    <div class="logo-row"><button class="ibtn" data-back>←</button><div class="logo">RC</div><h1>RC <span>ANIMES</span></h1></div>
    <input class="search" id="q" type="search" placeholder="Buscar anime..." autocomplete="off" style="margin-bottom:0">
  </div></header>
  <main class="wrap">
    <div class="status" id="st">Carregando animes...</div>
    <div class="grid" id="grid"></div>
    <div id="view" class="hidden">
      <button class="back" id="vBack">← Voltar</button>
      <div class="head"><div class="hc" id="vC"></div><div><div class="hn" id="vN"></div><div class="hs" id="vS"></div></div></div>
      <div id="temps"></div>
    </div>
  </main>
</div>
</template>

<template id="t-musica">
<div>
  <header class="top"><div class="wrap">
    <div class="logo-row"><button class="ibtn" data-back>←</button><div class="logo">RC</div><h1>RC <span>MÚSICAS</span></h1></div>
    <div id="sw"><input class="search" id="q" type="search" placeholder="Buscar cantor..." autocomplete="off"></div>
    <div class="tabs" id="tabs"></div>
  </div></header>
  <main class="wrap" id="mm">
    <div class="status" id="st">Carregando músicas...</div>
    <div class="grid" id="grid"></div>
    <div id="view" class="hidden">
      <button class="back" id="vBack">← Voltar</button>
      <div class="head"><div class="hc" id="vC"></div><div><div class="hn" id="vN"></div><div class="hs" id="vS"></div><button class="btn fill" style="width:auto;padding:8px 18px;margin-top:10px" id="vAll">▶ Tocar tudo</button></div></div>
      <div id="songs" style="margin-top:18px"></div>
    </div>
  </main>
  <div class="mini hidden" id="mini">
    <div class="r"><div class="ti" id="mT"></div><button id="mX" aria-label="Fechar">✕</button></div>
    <div class="r"><span class="tm" id="mA">0:00</span><input type="range" id="mR" min="0" max="1000" value="0"><span class="tm" id="mB">0:00</span></div>
    <div class="r" style="justify-content:center"><button id="m10b">⏪</button><button id="mP">⏮</button><button class="pl" id="mPl">▶</button><button id="mN">⏭</button><button id="m10f">⏩</button></div>
    <audio id="aud" preload="none"></audio>
  </div>
</div>
</template>

<template id="t-player">
<div class="pl">
  <div class="pl-top"><button id="pBack">← Voltar</button><div class="tt" id="pTitle"></div><button id="pSb" class="hidden"></button><button id="pNew" class="hidden">Abrir em nova aba ↗</button></div>
  <div class="stage" id="stage"></div>
</div>
</template>

<template id="t-settings">
<div class="set">
  <div style="display:flex;align-items:center;gap:10px"><button class="ibtn" data-back>←</button><h1 style="text-align:center;flex:1;font-size:22px">SETTINGS</h1></div>
  <div class="sec">Conta</div>
  <div class="row"><span>Nome:</span><span id="sNome">—</span></div>
  <div class="row"><span>E-mail:</span><span id="sMail">—</span></div>
  <div class="row"><span>Cadastro:</span><span id="sData">—</span></div>
  <button class="row" id="sReset"><span style="color:#fff">Redefinir Senha</span><span>›</span></button>
  <div class="sec">Informações</div>
  <button class="row" id="sPriv"><span style="color:#fff">Política de Privacidade</span><span>›</span></button>
  <button class="row" id="sTerm"><span style="color:#fff">Termos de uso</span><span>›</span></button>
  <button class="row" id="sSup"><span style="color:#fff">Fale conosco / suporte</span><span>›</span></button>
  <div class="sec">Sistema</div>
  <div class="row"><span>Versão do app:</span><span id="sVer">web</span></div>
  <button class="row" id="sCache"><span style="color:#fff">Clear cache</span><span>›</span></button>
  <button class="row" id="sOut"><span style="color:#fff">Log Out</span><span>›</span></button>

views.anime = function () {
  var animes = [], atual = null;
  var grid = $('#grid'), st = $('#st'), q = $('#q'), view = $('#view');
  function chave(a, t, e) { return a.nome + '_t' + (t + 1) + '_ep' + (e + 1); }
  function logo(box, a) {
    box.replaceChildren();
    function fb() { box.replaceChildren(); var f = document.createElement('div'); f.className = 'fb'; f.textContent = ini(a.nome); box.appendChild(f); }
    if (a.capa) { var im = document.createElement('img'); im.alt = a.nome; im.referrerPolicy = 'no-referrer'; im.onerror = fb; im.src = a.capa; box.appendChild(im); } else fb();
  }
  function total(a) { return a.temps.reduce(function (s, t) { return s + t.eps.length; }, 0); }
  db.ref('conteudo/animes').once('value').then(function (s) {
    s.forEach(function (a) {
      var temps = [];
      a.child('temporadas').forEach(function (t) {
        var eps = []; t.child('episodios').forEach(function (e) { var u = e.val(); if (typeof u === 'string' && u) eps.push(u); });
        temps.push({ nome: t.child('nome').val() || ('TEMPORADA ' + t.key), breve: t.child('emBreve').val() === true, eps: eps });
      });
      animes.push({ nome: a.child('nome').val() || a.key, capa: a.child('logo').val() || a.child('capa').val() || '', temps: temps });
    });
    if (!animes.length) { st.textContent = 'Nenhum anime cadastrado ainda.'; return; }
    st.classList.add('hidden'); draw();
  }).catch(function (e) { st.textContent = 'Erro ao carregar animes: ' + e.message; });
  function draw() {
    var t = q.value.trim().toLowerCase();
    var l = animes.filter(function (a) { return !t || a.nome.toLowerCase().indexOf(t) > -1; });
    grid.replaceChildren();
    if (!l.length) { st.classList.remove('hidden'); st.textContent = 'Nenhum anime encontrado.'; return; }
    st.classList.add('hidden');
    l.forEach(function (a) {
      var c = document.createElement('div'); c.className = 'card';
      var cv = document.createElement('div'); cv.className = 'cover'; logo(cv, a);
      var b = document.createElement('div'); b.className = 'cb';
      var n = document.createElement('div'); n.className = 'cn'; n.textContent = a.nome;
      var s = document.createElement('div'); s.className = 'cs'; s.textContent = a.temps.length + (a.temps.length === 1 ? ' temporada' : ' temporadas');
      b.append(n, s); c.append(cv, b); c.onclick = function () { abrir(a); }; grid.appendChild(c);
    });
  }
  q.oninput = draw;
  function abrir(a) {
    atual = a; logo($('#vC'), a); $('#vN').textContent = a.nome;
    $('#vS').textContent = a.temps.length + (a.temps.length === 1 ? ' temporada' : ' temporadas') + ' • ' + total(a) + ' episódios';
    marcar(); grid.classList.add('hidden'); view.classList.remove('hidden'); $('.search').classList.add('hidden'); window.scrollTo(0, 0);
    history.pushState({ v: 1 }, '');
  }
  function fechar() { atual = null; view.classList.add('hidden'); grid.classList.remove('hidden'); $('.search').classList.remove('hidden'); }
  $('#vBack').onclick = function () { if (history.state && history.state.v) history.back(); else fechar(); };
  function onPop() { if (atual) fechar(); }
  window.addEventListener('popstate', onPop);
  function marcar() {
    var box = $('#temps'); box.replaceChildren();
    atual.temps.forEach(function (t, ti) {
      var h = document.createElement('div'); h.className = 'temp'; h.textContent = t.nome; box.appendChild(h);
      if (t.breve || !t.eps.length) { var s = document.createElement('div'); s.className = 'soon'; s.textContent = 'Em breve'; box.appendChild(s); return; }
      var row = document.createElement('div'); row.className = 'eps';
      t.eps.forEach(function (u, ei) {
        var b = document.createElement('button'); b.className = 'ep' + (lsGet('rc_prog_' + chave(atual, ti, ei)) !== null ? ' seen' : '');
        b.innerHTML = '<b></b><small>EP</small>'; b.firstChild.textContent = ei + 1;
        b.onclick = function () { tocar(ti, ei); }; row.appendChild(b);
      });
      box.appendChild(row);
    });
  }
  function tocar(t, e) {
    var urls = [], ids = [], titles = [], p = 0, n = 0;
    atual.temps.forEach(function (tt, ti) { if (tt.breve) return; tt.eps.forEach(function (u, ei) {
      if (ti === t && ei === e) p = n; n++; urls.push(u); ids.push(chave(atual, ti, ei)); titles.push(atual.nome + ' • T' + (ti + 1) + ' EP ' + (ei + 1));
    }); });
    try { sessionStorage.setItem('rc_playlist', JSON.stringify({ urls: urls, ids: ids, titles: titles, pos: p })); } catch (x) {}
    openPlayer(urls[p], titles[p], 'video');
  }
  return function () { window.removeEventListener('popstate', onPop); };
};

/* ===================== MÚSICAS ===================== */
views.musica = function () {
  var gen = {}, lista = [], aberto = null, tocando = null, idx = -1, pushed = false;
  var grid = $('#grid'), st = $('#st'), tabs = $('#tabs'), q = $('#q'), view = $('#view'), songs = $('#songs');
  var au = $('#aud'), mini = $('#mini');
  db.ref('conteudo/musicas').once('value').then(function (sg) {
    sg.forEach(function (g) {
      var cs = [];
      g.forEach(function (c) {
        var nome = c.child('_nome').val(); if (!nome || !String(nome).trim()) nome = c.key; var ms = [];
        c.forEach(function (m) { if (m.key === '_nome') return; var v = m.val();
          if (typeof v === 'string') ms.push({ nome: m.key, url: v }); else if (v && typeof v === 'object') ms.push({ nome: v.nome || m.key, url: v.url || '' }); });
        if (ms.length) cs.push({ nome: nome, genero: g.key, musicas: ms });
      });
      gen[g.key] = cs;
    });
    var ns = Object.keys(gen); if (!ns.length) { st.textContent = 'Nenhuma música cadastrada ainda.'; return; }
    ['__T'].concat(ns).forEach(function (n) { var t = document.createElement('div'); t.className = 'tab'; t.dataset.g = n; t.textContent = n === '__T' ? 'TODOS' : n; t.onclick = function () { pick(n); }; tabs.appendChild(t); });
    pick('__T');
  }).catch(function (e) { st.textContent = 'Erro ao carregar músicas: ' + e.message; });
  function pick(n) {
    Array.prototype.forEach.call(tabs.children, function (t) { t.classList.toggle('active', t.dataset.g === n); });
    lista = n === '__T' ? Object.keys(gen).reduce(function (a, k) { return a.concat(gen[k]); }, []) : (gen[n] || []); draw();
  }
  function draw() {
    var t = q.value.trim().toLowerCase();
    var l = t ? lista.filter(function (c) { return curto(c.nome).toLowerCase().indexOf(t) > -1; }) : lista;
    grid.replaceChildren(); if (!l.length) { st.classList.remove('hidden'); st.textContent = 'Nenhum cantor encontrado.'; return; } st.classList.add('hidden');
    l.forEach(function (c) {
      var card = document.createElement('div'); card.className = 'card' + (c === tocando ? ' playing' : '');
      var cv = document.createElement('div'); cv.className = 'cover'; cv.style.background = grad(c.nome);
      var i = document.createElement('div'); i.className = 'fb'; i.style.cssText = 'border:0;color:#fff;font-size:28px;width:auto;height:auto'; i.textContent = ini(curto(c.nome)); cv.appendChild(i);
      var b = document.createElement('div'); b.className = 'cb';
      var n = document.createElement('div'); n.className = 'cn'; n.textContent = curto(c.nome);
      var s = document.createElement('div'); s.className = 'cs'; s.textContent = c.musicas.length + (c.musicas.length === 1 ? ' música' : ' músicas');
      b.append(n, s); card.append(cv, b); card.onclick = function () { abrirC(c); }; grid.appendChild(card);
    });
  }
  q.oninput = draw;
  function abrirC(c) {
    aberto = c; var vc = $('#vC'); vc.style.background = grad(c.nome); vc.textContent = ini(curto(c.nome));
    $('#vN').textContent = curto(c.nome); $('#vS').textContent = c.genero + ' • ' + c.musicas.length + ' músicas';
    songs.replaceChildren();
    c.musicas.forEach(function (m, i) {
      var r = document.createElement('div'); r.className = 'song';
      var a = document.createElement('div'); a.className = 'n'; a.textContent = i + 1;
      var b = document.createElement('div'); b.className = 'nm'; b.textContent = curto(m.nome);
      var p = document.createElement('div'); p.className = 'pp'; p.textContent = '▶';
      r.append(a, b, p); r.onclick = function () { tocar(c, i); }; songs.appendChild(r);
    });
    grid.classList.add('hidden'); tabs.classList.add('hidden'); $('#sw').classList.add('hidden'); view.classList.remove('hidden'); window.scrollTo(0, 0);
    if (!pushed) { history.pushState({ v: 1 }, ''); pushed = true; } mark();
  }
  function voltar() { aberto = null; pushed = false; view.classList.add('hidden'); grid.classList.remove('hidden'); tabs.classList.remove('hidden'); $('#sw').classList.remove('hidden'); draw(); }
  $('#vBack').onclick = function () { pushed ? history.back() : voltar(); };
  function onPop() { if (!view.classList.contains('hidden')) voltar(); }
  window.addEventListener('popstate', onPop);
  $('#vAll').onclick = function () { if (aberto) tocar(aberto, 0); };
  function mark() { Array.prototype.forEach.call(songs.children, function (r, i) { r.classList.toggle('playing', aberto === tocando && i === idx); }); }
  function tocar(c, i) {
    if (!c || i < 0 || i >= c.musicas.length) return; var m = c.musicas[i];
    if (!m.url) { toast('Esta música não tem link cadastrado.'); return; }
    tocando = c; idx = i; mark(); mini.classList.remove('hidden'); document.body.style.paddingBottom = '150px';
    $('#mT').innerHTML = '<span></span><small></small>'; $('#mT').firstChild.textContent = curto(m.nome); $('#mT').lastChild.textContent = curto(c.nome);
    au.src = driveUrl(m.url); au.play().catch(function () {});
    if ('mediaSession' in navigator) { try { navigator.mediaSession.metadata = new MediaMetadata({ title: curto(m.nome), artist: curto(c.nome) }); } catch (e) {} }
  }
  function passo(d) { if (!tocando) return; var n = tocando.musicas.length; tocar(tocando, (idx + d + n) % n); }
  $('#mP').onclick = function () { passo(-1); }; $('#mN').onclick = function () { passo(1); };
  $('#m10b').onclick = function () { au.currentTime = Math.max(0, au.currentTime - 10); };
  $('#m10f').onclick = function () { au.currentTime = Math.min(au.duration || 1e9, au.currentTime + 10); };
  $('#mPl').onclick = function () { au.paused ? au.play().catch(function () {}) : au.pause(); };
  $('#mX').onclick = function () { au.pause(); au.removeAttribute('src'); au.load(); mini.classList.add('hidden'); document.body.style.paddingBottom = ''; tocando = null; idx = -1; mark(); draw(); };
  au.onplay = function () { $('#mPl').textContent = '⏸'; }; au.onpause = function () { $('#mPl').textContent = '▶'; };
  au.onended = function () { passo(1); };
  au.onerror = function () { if (au.getAttribute('src')) toast('Não foi possível carregar esta música'); };
  au.onloadedmetadata = function () { $('#mB').textContent = fmt(au.duration); };
  au.ontimeupdate = function () { $('#mA').textContent = fmt(au.currentTime); if (au.duration) $('#mR').value = au.currentTime / au.duration * 1000; };
  $('#mR').oninput = function () { if (au.duration) au.currentTime = this.value / 1000 * au.duration; };
  if ('mediaSession' in navigator) { try { navigator.mediaSession.setActionHandler('previoustrack', function () { passo(-1); }); navigator.mediaSession.setActionHandler('nexttrack', function () { passo(1); }); } catch (e) {} }
  return function () { window.removeEventListener('popstate', onPop); au.pause(); au.removeAttribute('src'); document.body.style.paddingBottom = ''; };
};

/* ===================== PLAYER ===================== */
views.player = function (q) {
  var kind = q.get('k') || 'live', url = q.get('u') || '', title = q.get('n') || 'Canal';
  var stage = $('#stage'), disp = [];
  $('#pTitle').textContent = title;
  $('#pBack').onclick = goBack;
  if (!url) { toast('URL inválida.'); goBack(); return; }
  var isM3u8 = /\.m3u8(\?|#|$)/i.test(url);
  if (kind === 'iframe' || (kind === 'live' && !isM3u8)) startIframe(); else startVideo();
  return function () { disp.forEach(function (f) { try { f(); } catch (e) {} }); };

  /* ---------- IFRAME ANTI-ADS ---------- */
  function startIframe() {
    if (isBlocked(url)) { stage.innerHTML = '<div class="hint" style="position:static;transform:none;margin:40px auto">Este endereço está na lista de bloqueio (anúncios/apostas/e-commerce).</div>'; return; }
    var protectedMode = lsGet('rc_sandbox') !== '0';
    var btnSb = $('#pSb'), btnNew = $('#pNew');
    btnNew.classList.remove('hidden'); btnSb.classList.remove('hidden');
    btnNew.onclick = function () { window.open(url, '_blank', 'noopener'); };
    var hintT;
    function load() {
      stage.replaceChildren();
      var f = document.createElement('iframe');
      // Sandbox: sem allow-popups / allow-top-navigation => bloqueia pop-ups e redirecionamentos da página inteira.
      if (protectedMode) f.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-presentation');
      f.setAttribute('allow', 'autoplay; encrypted-media; fullscreen; picture-in-picture');
      f.setAttribute('allowfullscreen', ''); f.referrerPolicy = 'origin';
      f.src = PROXY_BASE ? PROXY_BASE + encodeURIComponent(url) : url;
      stage.appendChild(f);
      btnSb.textContent = protectedMode ? '🛡 Proteção: ON' : '🛡 Proteção: OFF';
      clearTimeout(hintT);
      hintT = setTimeout(function () {
        if (stage.querySelector('.hint')) return;
        var h = document.createElement('div'); h.className = 'hint';
        h.innerHTML = 'Não carregou? Alguns sites recusam ser exibidos aqui ou exigem a proteção desligada.<br>';
        var b1 = document.createElement('button'); b1.textContent = 'Abrir em nova aba ↗'; b1.onclick = btnNew.onclick;
        var b2 = document.createElement('button'); b2.textContent = protectedMode ? 'Desligar proteção' : 'Ligar proteção'; b2.onclick = btnSb.onclick;
        var b3 = document.createElement('button'); b3.textContent = '✕'; b3.onclick = function () { h.remove(); };
        h.append(b1, b2, b3); stage.appendChild(h);
      }, 9000);
    }
    btnSb.onclick = function () { protectedMode = !protectedMode; lsSet('rc_sandbox', protectedMode ? '1' : '0'); load(); };
    load(); disp.push(function () { clearTimeout(hintT); });
  }

  /* ---------- VIDEO (HLS.js / nativo) ---------- */
  function startVideo() {
    var pl = null;
    if (kind === 'video') { try { pl = JSON.parse(sessionStorage.getItem('rc_playlist') || 'null'); } catch (e) {} }
    var pos = pl ? pl.pos : 0;
    stage.innerHTML =
      '<video id="v" playsinline autoplay preload="auto"></video>' +
      '<div class="mid"><div class="spin"></div></div>' +
      '<div class="ctrl" id="ctrl">' +
        '<div class="seek"><span id="tA">0:00</span><input type="range" id="sk" min="0" max="1000" value="0"><span id="tB">0:00</span><span class="live hidden" id="lv">AO VIVO</span></div>' +
        '<div class="btns">' +
          '<button id="bPrev" title="Anterior (P)">⏮</button><button id="bBk" title="-10s (←)">⏪</button>' +
          '<button class="big" id="bPlay" title="Play/Pause (espaço)">▶</button>' +
          '<button id="bFw" title="+10s (→)">⏩</button><button id="bNext" title="Próximo (N)">⏭</button>' +
          '<button id="bMute" title="Mudo (M)">🔊</button><input type="range" id="vol" min="0" max="1" step="0.05" value="1" style="width:80px;accent-color:#e50914">' +
          '<span class="sp"></span>' +
          '<select id="sSpd" title="Velocidade"><option>0.5</option><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select>' +
          '<select id="sQ" title="Qualidade"><option value="-1">Auto</option></select>' +
          '<button id="bAsp" title="Aspecto (A)" style="font-size:11px;font-weight:700">FIT</button>' +
          '<button id="bPip" title="Picture-in-Picture (I)">⧉</button>' +
          '<button id="bFs" title="Tela cheia (F)">⛶</button>' +
        '</div></div>';
    var v = $('#v'), ctrl = $('#ctrl'), hls = null, cur = null, ended = false, lastSave = 0, errTried = 0;
    var ASP = [['contain', 'FIT'], ['cover', 'ZOOM'], ['fill', 'ESTICAR']], aspI = parseInt(lsGet('rc_aspect') || '0', 10) || 0;
    function setAsp() { v.style.objectFit = ASP[aspI][0]; $('#bAsp').textContent = ASP[aspI][1]; lsSet('rc_aspect', aspI); }
    setAsp(); $('#bAsp').onclick = function () { aspI = (aspI + 1) % ASP.length; setAsp(); };
    $('#bPip').classList.toggle('hidden', !document.pictureInPictureEnabled);

    function current() { return pl ? { url: pl.urls[pos], id: pl.ids[pos], title: pl.titles[pos] } : { url: url, id: 'u_' + url, title: title }; }
    function isLive() { return !isFinite(v.duration) || v.duration === 0; }
    function destroyHls() { if (hls) { try { hls.destroy(); } catch (e) {} hls = null; } }
    function showErr(msg) {
      stage.classList.remove('load'); var old = stage.querySelector('.hint'); if (old) old.remove();
      var h = document.createElement('div'); h.className = 'hint'; h.textContent = msg + ' ';
      var b = document.createElement('button'); b.textContent = 'Tentar de novo'; b.onclick = function () { h.remove(); errTried = 0; load(0); };
      var n = document.createElement('button'); n.textContent = 'Abrir em nova aba ↗'; n.onclick = function () { window.open(driveUrl(cur.url), '_blank', 'noopener'); };
      h.append(document.createElement('br'), b, n); stage.appendChild(h);
    }
    function load(startAt) {
      cur = current(); ended = false; destroyHls(); stage.classList.add('load');
      $('#pTitle').textContent = cur.title; var old = stage.querySelector('.hint'); if (old) old.remove();
      $('#bPrev').classList.toggle('hidden', !pl || pos <= 0); $('#bNext').classList.toggle('hidden', !pl || pos >= pl.urls.length - 1);
      var src = driveUrl(cur.url);
      if (location.protocol === 'https:' && /^http:\/\//i.test(src)) { showErr('Este link usa HTTP e o navegador bloqueia conteúdo misto em páginas HTTPS.'); return; }
      v.dataset.start = startAt || 0;
      if (/\.m3u8(\?|#|$)/i.test(src)) {
        if (window.Hls && Hls.isSupported()) {
          hls = new Hls({ enableWorker: true, lowLatencyMode: true, maxBufferLength: 30 });
          hls.loadSource(src); hls.attachMedia(v);
          hls.on(Hls.Events.MANIFEST_PARSED, function (e, d) {
            var s = $('#sQ'); s.length = 1; d.levels.forEach(function (l, i) { var o = document.createElement('option'); o.value = i; o.textContent = (l.height ? l.height + 'p' : Math.round(l.bitrate / 1000) + 'k'); s.appendChild(o); });
            s.style.display = d.levels.length > 1 ? '' : 'none'; v.play().catch(function () {});
          });
          hls.on(Hls.Events.ERROR, function (e, d) {
            if (!d.fatal) return;
            if (d.type === Hls.ErrorTypes.NETWORK_ERROR && errTried < 3) { errTried++; hls.startLoad(); }
            else if (d.type === Hls.ErrorTypes.MEDIA_ERROR && errTried < 3) { errTried++; hls.recoverMediaError(); }
            else showErr('Não foi possível reproduzir o canal (erro ' + (d.details || d.type) + '). Pode ser bloqueio de CORS do servidor de origem.');
          });
        } else if (v.canPlayType('application/vnd.apple.mpegurl')) { v.src = src; $('#sQ').style.display = 'none'; }
        else { showErr('Seu navegador não suporta HLS.'); return; }
      } else { $('#sQ').style.display = 'none'; v.src = src; v.play().catch(function () {}); }
    }
    v.addEventListener('loadedmetadata', function () {
      var live = isLive(); $('#lv').classList.toggle('hidden', !live); $('#sk').classList.toggle('hidden', live);
      $('#tA').classList.toggle('hidden', live); $('#tB').classList.toggle('hidden', live); $('#bBk').classList.toggle('hidden', live); $('#bFw').classList.toggle('hidden', live); $('#sSpd').classList.toggle('hidden', live);
      $('#tB').textContent = fmt(v.duration);
      var s = parseInt(v.dataset.start || '0', 10); v.dataset.start = 0;
      var saved = live ? 0 : parseInt(lsGet('rc_prog_' + cur.id) || '0', 10);
      if (s > 0) v.currentTime = s;
      else if (saved > 5 && saved < v.duration - 15) {
        v.pause();
        var o = document.createElement('div'); o.className = 'ovl'; var b = document.createElement('div'); b.className = 'box';
        var h = document.createElement('h2'); h.textContent = 'Continuar assistindo?';
        var p = document.createElement('p'); p.className = 'sub'; p.textContent = 'Você parou em ' + fmt(saved) + '.';
        var b1 = document.createElement('button'); b1.className = 'btn fill'; b1.textContent = 'CONTINUAR';
        var b2 = document.createElement('button'); b2.className = 'btn'; b2.textContent = 'RECOMEÇAR';
        b1.onclick = function () { v.currentTime = saved; o.remove(); v.play().catch(function () {}); };
        b2.onclick = function () { lsDel('rc_prog_' + cur.id); o.remove(); v.play().catch(function () {}); };
        b.append(h, p, b1, b2); o.appendChild(b); stage.appendChild(o);
      }
    });
    function nextEp() { if (ended) return; if (pl && pos < pl.urls.length - 1) { ended = true; lsSet('rc_prog_' + cur.id, '0'); pos++; load(0); toast('Reproduzindo: ' + pl.titles[pos]); } }
    v.addEventListener('playing', function () { stage.classList.remove('load'); errTried = 0; $('#bPlay').textContent = '⏸'; });
    v.addEventListener('waiting', function () { stage.classList.add('load'); });
    v.addEventListener('canplay', function () { stage.classList.remove('load'); });
    v.addEventListener('pause', function () { $('#bPlay').textContent = '▶'; });
    v.addEventListener('ended', function () { if (pl && pos < pl.urls.length - 1) nextEp(); else { lsSet('rc_prog_' + cur.id, '0'); toast('Finalizado!'); } });
    v.addEventListener('error', function () { if (!hls && v.getAttribute('src')) showErr('Não foi possível reproduzir este vídeo.'); });
    v.addEventListener('timeupdate', function () {
      if (isLive()) return; var t = v.currentTime, d = v.duration;
      $('#tA').textContent = fmt(t); if (d) $('#sk').value = t / d * 1000;
      if (t > 1 && Math.abs(t - lastSave) >= 5) { lastSave = t; lsSet('rc_prog_' + cur.id, String(Math.floor(t))); }
      if (pl && pos < pl.urls.length - 1 && d - t <= 5 && d > 30) nextEp(); // pula 5s antes do fim
    });
    $('#sk').oninput = function () { if (v.duration) v.currentTime = this.value / 1000 * v.duration; };
    $('#bPlay').onclick = function () { v.paused ? v.play().catch(function () {}) : v.pause(); };
    $('#bBk').onclick = function () { v.currentTime = Math.max(0, v.currentTime - 10); };
    $('#bFw').onclick = function () { v.currentTime = Math.min(v.duration || 1e9, v.currentTime + 10); };
    $('#bPrev').onclick = function () { if (pl && pos > 0) { pos--; ended = true; load(0); } };
    $('#bNext').onclick = function () { if (pl && pos < pl.urls.length - 1) { lsSet('rc_prog_' + cur.id, '0'); pos++; ended = true; load(0); } };
    $('#bMute').onclick = function () { v.muted = !v.muted; };
    v.addEventListener('volumechange', function () { $('#bMute').textContent = v.muted || v.volume === 0 ? '🔇' : '🔊'; $('#vol').value = v.muted ? 0 : v.volume; });
    $('#vol').oninput = function () { v.muted = false; v.volume = parseFloat(this.value); };
    $('#sSpd').onchange = function () { v.playbackRate = parseFloat(this.value); };
    $('#sQ').onchange = function () { if (hls) hls.currentLevel = parseInt(this.value, 10); };
    $('#bPip').onclick = function () { if (document.pictureInPictureElement) document.exitPictureInPicture(); else v.requestPictureInPicture().catch(function () { toast('PiP indisponível'); }); };
    function fs() {
      var d = document;
      if (d.fullscreenElement || d.webkitFullscreenElement) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); try { screen.orientation.unlock(); } catch (e) {} }
      else if (stage.requestFullscreen) { stage.requestFullscreen().then(function () { try { screen.orientation.lock('landscape'); } catch (e) {} }).catch(function () {}); }
      else if (stage.webkitRequestFullscreen) stage.webkitRequestFullscreen();
      else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
    }
    $('#bFs').onclick = fs; v.addEventListener('dblclick', fs);
    // auto-esconder controles
    var idleT; function wake() { stage.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(function () { if (!v.paused) stage.classList.add('idle'); }, 3000); }
    ['mousemove', 'touchstart', 'click', 'keydown'].forEach(function (e) { stage.addEventListener(e, wake, { passive: true }); }); wake();
    v.addEventListener('click', function () { if (stage.classList.contains('idle')) return; v.paused ? v.play().catch(function () {}) : v.pause(); });
    function key(e) {
      if (/INPUT|SELECT/.test((e.target.tagName || ''))) return; var k = e.key.toLowerCase();
      if (k === ' ') { e.preventDefault(); $('#bPlay').click(); } else if (k === 'arrowleft') $('#bBk').click(); else if (k === 'arrowright') $('#bFw').click();
      else if (k === 'f') fs(); else if (k === 'm') $('#bMute').click(); else if (k === 'a') $('#bAsp').click(); else if (k === 'i') $('#bPip').click();
      else if (k === 'n') $('#bNext').click(); else if (k === 'p') $('#bPrev').click(); wake();
    }
    document.addEventListener('keydown', key);
    function saveNow() { try { if (cur && !isLive() && v.currentTime > 1) lsSet('rc_prog_' + cur.id, String(Math.floor(v.currentTime))); } catch (e) {} }
    window.addEventListener('pagehide', saveNow);
    document.addEventListener('visibilitychange', function () { if (document.hidden) saveNow(); });
    disp.push(function () {
      saveNow(); clearTimeout(idleT); document.removeEventListener('keydown', key); window.removeEventListener('pagehide', saveNow);
      destroyHls(); v.pause(); v.removeAttribute('src'); v.load();
      if (document.fullscreenElement) document.exitFullscreen().catch(function () {}); try { screen.orientation.unlock(); } catch (e) {}
    });
    load(0);
  }
};

/* ===================== SETTINGS ===================== */
views.settings = function () {
  db.ref('conta/' + user.uid).once('value').then(function (s) {
    var v = s.val() || {};
    $('#sNome').textContent = v.name || user.displayName || '—'; $('#sMail').textContent = v.email || user.email || '—'; $('#sData').textContent = v.data || '—';
  }).catch(function () { toast('Erro ao carregar dados'); });
  $('#sReset').onclick = function () { location.hash = '#/redefinir'; };
  $('#sPriv').onclick = function () { location.hash = '#/privacidade'; };
  $('#sTerm').onclick = function () { location.hash = '#/termos'; };
  $('#sSup').onclick = function () { window.open('https://wa.me/' + SUPPORT_PHONE, '_blank', 'noopener'); };
  $('#sDon').onclick = function () { window.open(DONATE_URL, '_blank', 'noopener'); };
  $('#sCache').onclick = function () {
    try { Object.keys(localStorage).forEach(function (k) { if (/^rc_(prog_|dialo|aspect|sandbox)/.test(k)) localStorage.removeItem(k); }); sessionStorage.clear(); } catch (e) {}
    if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
    toast('Cache limpo com sucesso');
  };
  $('#sOut').onclick = function () { auth.signOut(); };
  $('#sDel').onclick = function () {
    if (!confirm('Essa ação é permanente e não pode ser desfeita. Deseja continuar?')) return;
    var u = auth.currentUser;
    u.delete().then(function () { return db.ref('conta/' + u.uid).remove().catch(function () {}); })
      .then(function () { toast('Conta excluída.'); })
      .catch(function (e) { toast(authErr(e), 4500); });
  };
};

})();
</script>
